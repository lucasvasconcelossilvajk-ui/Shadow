name: Build Shadow APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - name: Build SDK and Sample Host
        run: |
          SDK_GRADLEW=$(find projects/sdk -name "gradlew" | head -n 1)
          chmod +x "$SDK_GRADLEW"
          "$SDK_GRADLEW" -p "$(dirname "$SDK_GRADLEW")" publishToMavenLocal
          SAMPLE_GRADLEW=$(find projects/sample -name "gradlew" | head -n 1)
          chmod +x "$SAMPLE_GRADLEW"
          "$SAMPLE_GRADLEW" -p "$(dirname "$SAMPLE_GRADLEW")" :sample-host:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TencentShadow-APK
          path: "**/build/outputs/apk/**/*.apk"
          
