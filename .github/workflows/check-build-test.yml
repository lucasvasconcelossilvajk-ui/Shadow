name: Build Shadow APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - name: Build SDK and Sample Host
        run: |
          chmod +x ./projects/sdk/gradlew
          ./projects/sdk/gradlew -p projects/sdk publishToMavenLocal
          chmod +x ./projects/sample/gradlew
          ./projects/sample/gradlew -p projects/sample :sample-host:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TencentShadow-APK
          path: "**/build/outputs/apk/**/*.apk"
          
